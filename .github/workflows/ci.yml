name: CI

# Always-run on PRs and on push to main (no path filter). The job is low-cost,
# and always-running avoids the branch-protection gotcha where a path-filtered
# required check is skipped and leaves unrelated PRs stuck "waiting". Optimise
# with path filters or a skip-job later, once CI is established.
on:
  pull_request:
  push:
    branches: [main]

# Least-privilege GITHUB_TOKEN: this job only reads code and runs build/audit.
permissions:
  contents: read

# Cancel superseded runs when new commits land on the same ref (saves minutes,
# avoids stale statuses). One in-flight run per branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customer-web:
    name: customer-web (typecheck / lint / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # repo-level source of truth (root .nvmrc)
          cache: npm

      - name: Install (root install — hoists workspaces)
        run: npm ci

      - name: Typecheck (customer-web)
        working-directory: apps/customer-web
        run: npm run typecheck

      # Default `next lint` (no --max-warnings): existing warnings do NOT fail the
      # job; only ESLint errors do. Reliable today (lint exits 0).
      - name: Lint (customer-web)
        working-directory: apps/customer-web
        run: npm run lint

      - name: Build (customer-web)
        working-directory: apps/customer-web
        env:
          # NEXT_PUBLIC_* are public-by-design (never secrets). The build fails
          # soft on API calls with these dummies, so CI needs no network/DB.
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy
          # NEXT_PUBLIC_MARKETPLACE_LIVE intentionally unset (marketplace gated).
        run: npm run build

      # Advisory only — NEVER fails the job (continue-on-error + always()). Scoped
      # to the customer-web workspace so the Expo / React-Native dev-tooling tree
      # adds no noise. Dependabot opens the structured update PRs; dependency
      # version remediation is a separate PR.
      - name: Dependency audit (advisory, customer-web high+)
        if: ${{ always() }}
        continue-on-error: true
        run: npm audit --workspace=@redeemo/customer-web --audit-level=high

  admin-web:
    name: admin-web (typecheck / lint / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # repo-level source of truth (root .nvmrc)
          cache: npm

      - name: Install (root install — hoists workspaces)
        run: npm ci

      - name: Typecheck (admin-web)
        working-directory: apps/admin-web
        run: npm run typecheck

      # Default `next lint` (no --max-warnings): existing warnings do NOT fail the
      # job; only ESLint errors do. Reliable today (lint exits 0).
      - name: Lint (admin-web)
        working-directory: apps/admin-web
        run: npm run lint

      - name: Build (admin-web)
        working-directory: apps/admin-web
        env:
          # NEXT_PUBLIC_* are public-by-design (never secrets). The build needs no
          # network/DB; this dummy only seeds the CSP connect-src origin.
          NEXT_PUBLIC_API_URL: http://localhost:3000
        run: npm run build

      # Advisory only — NEVER fails the job (continue-on-error + always()). Scoped
      # to the admin-web workspace. Dependabot opens the structured update PRs;
      # dependency version remediation is a separate PR.
      - name: Dependency audit (advisory, admin-web high+)
        if: ${{ always() }}
        continue-on-error: true
        run: npm audit --workspace=@redeemo/admin-web --audit-level=high

  backend:
    name: backend (typecheck + unit)
    runs-on: ubuntu-latest
    # Dummy non-secret env. The `unit` suites mock prisma/redis (no live
    # services); boot-time env validation + `prisma generate` only need the
    # vars PRESENT, not reachable. The real-DB `integration` project is NOT run
    # here yet — PR2 adds a local Postgres service + fresh seed, then promotes
    # it from advisory to required. (Test secrets come from tests/setup.ts.)
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_dummy
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # repo-level source of truth (root .nvmrc)
          cache: npm

      - name: Install (root install — hoists workspaces)
        run: npm ci

      # generated/prisma is gitignored — regenerate the client before tsc/tests.
      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck (backend)
        run: npx tsc --noEmit

      # `unit` project = mock / no-DB suites only (deterministic, no services).
      - name: Unit tests (backend)
        run: npm run test:unit
