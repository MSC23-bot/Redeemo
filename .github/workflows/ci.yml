name: CI

# Always-run on PRs and on push to main (no path filter). The job is low-cost,
# and always-running avoids the branch-protection gotcha where a path-filtered
# required check is skipped and leaves unrelated PRs stuck "waiting". Optimise
# with path filters or a skip-job later, once CI is established.
on:
  pull_request:
  push:
    branches: [main]

# Least-privilege GITHUB_TOKEN: this job only reads code and runs build/audit.
permissions:
  contents: read

# Cancel superseded runs when new commits land on the same ref (saves minutes,
# avoids stale statuses). One in-flight run per branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customer-web:
    name: customer-web (typecheck / lint / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # repo-level source of truth (root .nvmrc)
          cache: npm

      - name: Install (root install — hoists workspaces)
        run: npm ci

      - name: Typecheck (customer-web)
        working-directory: apps/customer-web
        run: npm run typecheck

      # Default `next lint` (no --max-warnings): existing warnings do NOT fail the
      # job; only ESLint errors do. Reliable today (lint exits 0).
      - name: Lint (customer-web)
        working-directory: apps/customer-web
        run: npm run lint

      - name: Build (customer-web)
        working-directory: apps/customer-web
        env:
          # NEXT_PUBLIC_* are public-by-design (never secrets). The build fails
          # soft on API calls with these dummies, so CI needs no network/DB.
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy
          # NEXT_PUBLIC_MARKETPLACE_LIVE intentionally unset (marketplace gated).
        run: npm run build

      # Advisory only — NEVER fails the job (continue-on-error + always()). Scoped
      # to the customer-web workspace so the Expo / React-Native dev-tooling tree
      # adds no noise. Dependabot opens the structured update PRs; dependency
      # version remediation is a separate PR.
      - name: Dependency audit (advisory, customer-web high+)
        if: ${{ always() }}
        continue-on-error: true
        run: npm audit --workspace=@redeemo/customer-web --audit-level=high

  admin-web:
    name: admin-web (typecheck / lint / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # repo-level source of truth (root .nvmrc)
          cache: npm

      - name: Install (root install — hoists workspaces)
        run: npm ci

      - name: Typecheck (admin-web)
        working-directory: apps/admin-web
        run: npm run typecheck

      # Default `next lint` (no --max-warnings): existing warnings do NOT fail the
      # job; only ESLint errors do. Reliable today (lint exits 0).
      - name: Lint (admin-web)
        working-directory: apps/admin-web
        run: npm run lint

      - name: Build (admin-web)
        working-directory: apps/admin-web
        env:
          # NEXT_PUBLIC_* are public-by-design (never secrets). The build needs no
          # network/DB; this dummy only seeds the CSP connect-src origin.
          NEXT_PUBLIC_API_URL: http://localhost:3000
        run: npm run build

      # Unit / component tests (jest + RTL, jsdom). No network/DB — the API layer
      # is mocked in tests. Required (fails the job on a red test).
      - name: Test (admin-web)
        working-directory: apps/admin-web
        run: npm test

      # Advisory only — NEVER fails the job (continue-on-error + always()). Scoped
      # to the admin-web workspace. Dependabot opens the structured update PRs;
      # dependency version remediation is a separate PR.
      - name: Dependency audit (advisory, admin-web high+)
        if: ${{ always() }}
        continue-on-error: true
        run: npm audit --workspace=@redeemo/admin-web --audit-level=high

  merchant-web:
    name: merchant-web (typecheck / lint / build / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # repo-level source of truth (root .nvmrc)
          cache: npm

      - name: Install (root install, hoists workspaces)
        run: npm ci

      - name: Typecheck (merchant-web)
        working-directory: apps/merchant-web
        run: npm run typecheck

      - name: Lint (merchant-web)
        working-directory: apps/merchant-web
        run: npm run lint

      - name: Build (merchant-web)
        working-directory: apps/merchant-web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
        run: npm run build

      - name: Test (merchant-web)
        working-directory: apps/merchant-web
        run: npm test

      - name: Dependency audit (advisory, merchant-web high+)
        if: ${{ always() }}
        continue-on-error: true
        run: npm audit --workspace=@redeemo/merchant-web --audit-level=high

  # PR-G1b: the deterministic local browser-smoke lane, PILOT/ADVISORY per the
  # roadmap CI tiers (T2 starts advisory; promotion to a required check is a
  # separate owner-approved step). The app is BUILT with NEXT_PUBLIC_API_URL on
  # a dead loopback port and every spec mocks /api/v1/** in the browser, so the
  # job can never reach Neon/Railway/staging. Assertion failures are NEVER
  # retried (retries: 0 in playwright.config.ts); continue-on-error keeps the
  # JOB green while the step stays visibly failed-but-continued.
  merchant-web-smoke:
    name: merchant-web browser smoke (advisory)
    runs-on: ubuntu-latest
    steps:
      # No git operations in this job and it uploads an artifact - do not
      # persist the checkout credentials (zizmor artipacked hardening).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # repo-level source of truth (root .nvmrc)
          cache: npm

      - name: Install (root install, hoists workspaces)
        run: npm ci

      - name: Install Playwright chromium (with system deps)
        working-directory: apps/merchant-web
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke (advisory)
        working-directory: apps/merchant-web
        continue-on-error: true
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: merchant-web-playwright-report
          path: apps/merchant-web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  backend:
    name: backend (typecheck + unit)
    runs-on: ubuntu-latest
    # Dummy non-secret env. The `unit` suites mock prisma/redis (no live
    # services); boot-time env validation + `prisma generate` only need the
    # vars PRESENT, not reachable. The real-DB `integration` project is NOT run
    # in THIS job; G1a1 runs it as a separate ADVISORY Postgres-16 Insights pilot
    # job (non-blocking), and G1a2 is the later owner-gated promotion to a required
    # lane plus expansion. (Test secrets come from tests/setup.ts.)
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_dummy
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # repo-level source of truth (root .nvmrc)
          cache: npm

      - name: Install (root install — hoists workspaces)
        run: npm ci

      # generated/prisma is gitignored — regenerate the client before tsc/tests.
      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck (backend)
        run: npx tsc --noEmit

      # `unit` project = mock / no-DB suites only (deterministic, no services).
      - name: Unit tests (backend)
        run: npm run test:unit

  # PR-G1a1: ADVISORY pilot of the 11 loopback-guarded Insights real-DB integration
  # suites against an EPHEMERAL Postgres-16 service. The job concludes GREEN even when
  # the suites fail (continue-on-error on the test step) so it never blocks the
  # SHA-bound merge during G1a1; failures are still surfaced (a failed-but-continued
  # step + an explicit FAIL job summary). NOT path-filtered and NOT in branch
  # protection (the PR-G1a2 path-trigger + skip-report machinery is a later,
  # owner-approved slice that promotes this to a required FAILING gate).
  backend-integration-pilot:
    name: backend integration pilot (advisory)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: redeemo_integration_test
        # Bind the host side to loopback only.
        ports:
          - 127.0.0.1:5432:5432
        # Container health-check IS the startup-retry mechanism (GitHub waits for
        # health before running steps). 10 retries x 5s.
        options: >-
          --health-cmd "pg_isready -U ci -d redeemo_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # BOTH point at the disposable loopback service; the project-global guard
      # (tests/integration.setup.ts) validates each INDEPENDENTLY before connecting.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/redeemo_integration_test
      TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/redeemo_integration_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (root install — hoists workspaces)
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      # Fail BEFORE any connection if DATABASE_URL is not strict-loopback. Host-only
      # check; never prints credentials or the full connection string. Mirrors the
      # integration setupFile guard's loopback set.
      - name: Assert loopback DB before connect (host-only; no credentials)
        run: >-
          node -e 'const u=new URL(process.env.DATABASE_URL);const ok=["127.0.0.1","localhost","::1","[::1]"].includes(u.hostname);if(!ok){console.error("ABORT: DATABASE_URL host "+u.hostname+" is not loopback");process.exit(1)}console.log("DATABASE_URL host is loopback: "+u.hostname)'

      # ONE visible retry for an unmistakable container startup/health failure ONLY
      # (a SELECT 1 via pg). NOT a retry of migrations or tests. Never prints the URL.
      - name: Wait for Postgres (one infra retry)
        run: >-
          node -e 'const{Client}=require("pg");const t=async()=>{const c=new Client({connectionString:process.env.DATABASE_URL});await c.connect();await c.query("SELECT 1");await c.end()};(async()=>{try{await t();console.log("Postgres reachable")}catch(e1){console.warn("::warning::Postgres not reachable on first attempt (infra); one retry after 5s");await new Promise(r=>setTimeout(r,5000));try{await t();console.log("Postgres reachable after one infra retry")}catch(e2){console.error("Postgres still unreachable after one infra retry:",e2&&e2.code||"ERR");process.exit(1)}}})()'

      # Migrations are NEVER retried.
      - name: Migrate disposable DB (no retry)
        run: npx prisma migrate deploy

      # Advisory: continue-on-error keeps the JOB green even if suites fail; the step
      # is still visibly marked failed-but-continued. Assertion / security / tenant /
      # legal-gate / test failures are NEVER retried (runs exactly once).
      - name: Run Insights integration pilot (advisory)
        id: pilot
        continue-on-error: true
        run: npm run test:integration:insights

      # Neon CU-burn PR-A Task A1: the maintenance-sweep real-DB suite (advisory,
      # same disposable loopback service). Verifies the advisory-lock /
      # statement-timeout / rollback semantics that unit mocks cannot prove.
      - name: Run maintenance-sweep integration pilot (advisory)
        id: maintenance_pilot
        continue-on-error: true
        run: npm run test:integration:maintenance

      # Invite concurrency + erasure: real-DB integration suite (same disposable
      # loopback service). Proves what unit mocks cannot — one MerchantLead per
      # business under concurrent submissions, the atomic ten-open-invite cap,
      # exact-duplicate idempotency at the cap boundary, safe lock-contention
      # termination, AND genuine account-erasure severance (pending reward grants
      # deleted with the person link, ISSUED financial records retained, invite
      # person-linkage nulled). Advisory like its siblings; PASS/FAIL below.
      - name: Run invite concurrency + erasure integration pilot (advisory)
        id: invites_pilot
        continue-on-error: true
        run: npm run test:integration:invites

      # Surface PASS/FAIL explicitly (never swallowed): a FAIL is written to the job
      # summary AND the step above shows failed-but-continued, while the job stays green.
      - name: Report pilot result (job summary)
        if: ${{ always() }}
        run: |
          if [ "${{ steps.pilot.outcome }}" = "success" ]; then
            echo "Advisory Insights pilot: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Advisory Insights pilot: FAIL (non-blocking in G1a1)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The 11 Insights real-DB suites did not all pass. See the 'Run Insights integration pilot (advisory)' step logs above. This is surfaced but does NOT block the SHA-bound merge during G1a1; PR-G1a2 (owner-approved) promotes this to a required FAILING check." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.maintenance_pilot.outcome }}" = "success" ]; then
            echo "Advisory maintenance-sweep pilot: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Advisory maintenance-sweep pilot: FAIL (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.invites_pilot.outcome }}" = "success" ]; then
            echo "Advisory invite concurrency + erasure pilot: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Advisory invite concurrency + erasure pilot: FAIL (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          fi
